<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Carmela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--bg:#fde6ef;--ink:#4a1030;--muted:#8a4a68;--red:#ec4d8f;--blue:#c2185b;--paper:#fff4f8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0c1c;--ink:#ffe6f0;--muted:#d9a3bd;--paper:#fff0f6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a0c1c;--ink:#ffe6f0;--muted:#d9a3bd;--paper:#fff0f6;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Courier Prime",ui-monospace,monospace}
[hidden]{display:none!important}
.stage{position:relative;height:100%;display:grid;place-items:center}
.env{--W:min(86vw,440px);--p:calc(var(--W)*.02);--m:calc(var(--W)*.065);--cw:min(calc(var(--W)*.9),calc((100svh - 170px)*9/16));--pen:#4a1030;--stripes:repeating-linear-gradient(135deg,var(--red) 0 14px,#fff 14px 24px,var(--blue) 24px 38px,#fff 38px 48px);position:relative;width:var(--W);height:calc(var(--W)*.66);margin-top:-30px;perspective:1400px}
.env>*{position:absolute}
.back{inset:0;z-index:0;background:#f4c3d8;border-radius:6px;box-shadow:0 30px 50px -20px rgba(74,16,48,.5)}
.front{inset:0;z-index:4;border-radius:6px;background:var(--stripes);padding:9px;box-sizing:border-box}
.paper{height:100%;background:var(--paper);border-radius:2px}
.back,.front,.info{transition:transform .9s cubic-bezier(.4,0,.6,1),opacity .6s}
.flap{left:0;top:0;width:100%;height:50%;z-index:5;transform-origin:top;transform-style:preserve-3d;transition:transform .8s .5s cubic-bezier(.5,0,.2,1),z-index 0s .5s}
.face{position:absolute;inset:0;backface-visibility:hidden;clip-path:polygon(0 0,100% 0,50% 100%)}
.out{background:var(--stripes)}
.out::after{content:"";position:absolute;inset:0;background:var(--paper);clip-path:polygon(4.5% 9%,95.5% 9%,50% 80%)}
.in{background:#e8a5c1;transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:100%;width:calc(var(--W)*.11);height:calc(var(--W)*.11);transform:translate(-50%,-50%);border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff93bd,var(--red) 55%,#a3124f);color:#fff;font-size:calc(var(--W)*.05);display:grid;place-items:center;cursor:pointer;backface-visibility:hidden;animation:pulse 2.4s ease-out infinite;transition:opacity .25s}
.seal:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(236,77,143,.55)}60%{box-shadow:0 0 0 14px rgba(236,77,143,0)}}
.info{inset:0;z-index:6;pointer-events:none;color:var(--pen)}
.tag{position:absolute;left:var(--m);top:calc(var(--m)*.9);background:var(--red);color:#fff;font-weight:700;font-size:max(9px,calc(var(--W)*.03));padding:2px 7px;letter-spacing:.05em;transform:rotate(-3deg)}
.stamp{position:absolute;right:var(--m);top:var(--m);width:calc(var(--p)*10);height:calc(var(--p)*13);transform:rotate(2deg);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35));pointer-events:auto;cursor:pointer;--r:calc(var(--p)*.32)}
.stamp::before{content:"";position:absolute;inset:0;background:#fff;-webkit-mask:radial-gradient(circle at center,transparent var(--r),#000 calc(var(--r) + .5px)) calc(var(--p)/-2) calc(var(--p)/-2)/var(--p) var(--p);mask:radial-gradient(circle at center,transparent var(--r),#000 calc(var(--r) + .5px)) calc(var(--p)/-2) calc(var(--p)/-2)/var(--p) var(--p)}
.stamp img{position:absolute;inset:calc(var(--p)*.5);width:calc(100% - var(--p));height:calc(100% - var(--p));object-fit:cover;display:block}
.pm{position:absolute;right:calc(var(--m)*.5);top:calc(var(--m)*.8);width:calc(var(--p)*20);transform:rotate(-8deg);opacity:.55;mix-blend-mode:multiply;fill:none;stroke:var(--pen)}
.pm text{fill:var(--pen);stroke:none;font:700 13px "Courier Prime",monospace;text-anchor:middle}
.greet{position:absolute;right:var(--m);bottom:calc(var(--m)*.9);margin:0;text-align:right;font:calc(var(--W)*.1)/.95 "Yellowtail",cursive;color:var(--blue)}
.addr{position:absolute;left:var(--m);bottom:calc(var(--m)*.9);font-size:max(11px,calc(var(--W)*.036));line-height:1.9;pointer-events:auto}
.addr span.l{color:var(--muted)}
.field{display:inline-block;min-width:calc(var(--W)*.26);border-bottom:1px solid rgba(74,16,48,.35);outline:0;vertical-align:bottom;white-space:nowrap}
.field:empty::before{content:attr(data-ph);opacity:.45}
.field:focus{border-bottom-color:var(--red)}
.hint{left:0;right:0;top:calc(100% + 28px);text-align:center;margin:0;color:var(--muted);font-size:14px;transition:opacity .4s}
.card{left:50%;top:50%;width:var(--cw);aspect-ratio:9/16;z-index:3;border-radius:14px;overflow:hidden;background:#3a1428;box-shadow:0 0 0 4px var(--paper),0 30px 60px -10px rgba(58,10,36,.55);transform:translate(-50%,-50%) scale(var(--s,.3));transition:transform 1s cubic-bezier(.3,.9,.25,1)}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.slot{position:absolute;inset:0;width:100%;border:0;background:#3a1428;color:#ffe0ee;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.slot::before{content:"";position:absolute;inset:5%;border:2px dashed rgba(255,224,238,.45);border-radius:10px}
.slot .plus{font-size:44px;line-height:1;font-weight:700}
.slot b{font-size:18px}.slot small{opacity:.7;font-size:13px}
.slot:focus-visible{outline:3px solid var(--red);outline-offset:-8px}
.env.open .flap{transform:rotateX(180deg);z-index:1;transition:transform .8s cubic-bezier(.5,0,.2,1),z-index 0s .35s}
.env.open .seal,.env.open .hint{opacity:0;pointer-events:none}
.env.open .card{transform:translate(-50%,calc(-50% - var(--rise,0px))) scale(var(--s,.3));transition-delay:.4s;transition-duration:.9s}
.env.reveal .card{transform:translate(-50%,-50%) scale(1);transition-delay:0s;transition-duration:1.1s}
.env.reveal .back,.env.reveal .front,.env.reveal .info{transform:translateY(70vh);opacity:0}
.env.reveal .flap{transform:translateY(70vh) rotateX(180deg);opacity:0;transition:transform .9s cubic-bezier(.4,0,.6,1),opacity .7s}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.bar button{font:700 14px "Courier Prime",monospace;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
.bar button:hover{background:var(--ink);color:var(--bg)}
.bar button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.bar{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>
<body>
<main class="stage">
<div class="env" id="env">
  <div class="back"></div>
  <div class="card" id="card">
    <video id="vid" src="video.mp4" playsinline controls loop preload="metadata"></video>
    <button class="slot" id="slot" type="button" hidden><span class="plus">+</span><b>Add your video</b><small>Vertical 9:16 works best</small></button>
  </div>
  <div class="front"><div class="paper"></div></div>
  <div class="flap"><div class="face out"></div><div class="face in"></div><button class="seal" type="button" aria-label="Open the envelope">♥</button></div>
  <div class="info">
    <span class="tag">Par Avion</span>
    <svg class="pm" viewBox="0 0 220 100" aria-hidden="true"><circle cx="50" cy="50" r="44" stroke-width="3"/><circle cx="50" cy="50" r="37" stroke-width="1.5"/><text x="50" y="47">Special</text><text x="50" y="63">delivery</text><path stroke-width="3" d="M104 28q9-9 18 0t18 0t18 0t18 0t18 0t18 0M104 50q9-9 18 0t18 0t18 0t18 0t18 0t18 0M104 72q9-9 18 0t18 0t18 0t18 0t18 0t18 0"/></svg>
    <div class="stamp" id="stamp"><img id="stampImg" alt="Birthday stamp" src="image.png"></div>
    <p class="greet">Happy<br>Birthday</p>
    <div class="addr">
      <div><span class="l">To: </span><span class="field" contenteditable="true" spellcheck="false" data-ph="Recipient’s name">Carmela</span></div>
      <div><span class="l">From: </span><span class="field" contenteditable="true" spellcheck="false" data-ph="Your name">Ryan</span></div>
    </div>
  </div>
  <p class="hint">Tap the envelope to open it</p>
</div>
</main>
<canvas id="fx"></canvas>
<nav class="bar">
  <button id="addv" type="button">Change video</button>
  <button id="again" type="button" hidden>Seal it again</button>
</nav>
<input id="vf" type="file" accept="video/*" hidden>
<input id="sf" type="file" accept="image/png,image/*" hidden>
<script>
const $=s=>document.querySelector(s);
const env=$('#env'),card=$('#card'),vid=$('#vid'),slot=$('#slot'),again=$('#again'),vf=$('#vf'),sf=$('#sf');
let busy=false,cur=null;
function fit(){const H=env.offsetHeight,ch=card.offsetHeight,s=H*.8/ch,hs=ch*s;card.style.setProperty('--s',s);card.style.setProperty('--rise',(H/2-hs*.1)+'px')}
fit();addEventListener('resize',fit);
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d'),d=devicePixelRatio||1,w=innerWidth,h=innerHeight;
  c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
  const cols=['#ec4d8f','#c2185b','#ffb3d1','#ffffff'];
  const ps=Array.from({length:90},()=>({x:w/2,y:h*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:4+Math.random()*5,c:cols[Math.random()*4|0]}));
  let t=0;
  (function f(){
    x.clearRect(0,0,w,h);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(++t<170)requestAnimationFrame(f);else x.clearRect(0,0,w,h);
  })();
}
function openIt(){
  if(busy||env.classList.contains('open'))return;
  busy=true;env.classList.add('open');
  setTimeout(()=>{env.classList.add('reveal');confetti();again.hidden=false;if(!vid.hidden)vid.play().catch(()=>{});busy=false},1700);
}
function closeIt(){
  if(busy)return;busy=true;vid.pause();again.hidden=true;
  env.classList.remove('reveal');
  setTimeout(()=>{env.classList.remove('open');busy=false},1150);
}
env.addEventListener('click',e=>{if(e.target.closest('.field,.stamp,.card'))return;openIt()});
again.onclick=closeIt;
$('#addv').onclick=slot.onclick=()=>vf.click();
vf.onchange=()=>{
  const f=vf.files[0];if(!f)return;
  cur=f;vid.dataset.fb='';
  if(vid.dataset.u)URL.revokeObjectURL(vid.dataset.u);
  vid.dataset.u=URL.createObjectURL(f);vid.src=vid.dataset.u;
  vid.hidden=false;slot.hidden=true;$('#addv').textContent='Change video';
  if(env.classList.contains('reveal'))vid.play().catch(()=>{});
};
vid.onerror=()=>{if(!cur||vid.dataset.fb)return;vid.dataset.fb='1';const r=new FileReader();r.onload=()=>{vid.src=r.result};r.readAsDataURL(cur)};
sf.onchange=()=>{const f=sf.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#stampImg').src=r.result};r.readAsDataURL(f)};
document.querySelectorAll('.field').forEach(el=>{
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}});
  el.addEventListener('input',()=>{if(!el.textContent.trim())el.innerHTML=''});
});
</script>
</body>
</html>
